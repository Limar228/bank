<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Пополнение счета — NEXT BANK</title>
    <link rel="stylesheet" href="/styles/dashboard_styles.css" />
    <link rel="stylesheet" href="/styles/replenish.css" />
  </head>
  <body>
    <div class="container">
      <button class="btn-back" id="btn-dashboard">На главную</button>

      <h1>Пополнение счета</h1>
      <p>
        Введите сумму и выберите способ оплаты для пополнения вашего баланса.
      </p>

      <div id="error-block" class="error-message"></div>
      <div id="success-block" class="success-message"></div>

      <div class="replenish-form">
        <form id="replenish-form-element">
          <div class="form-group">
            <label for="account-select">Выберите счет</label>
            <select id="account-select" class="form-control" required>
              <option value="RUB">Основной счет (Рубли)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="card-input">Номер карты зачисления</label>
            <input
              type="text"
              id="card-input"
              class="form-control"
              placeholder="0000 0000 0000 0000"
              maxlength="19"
              inputmode="numeric"
              required
            />
          </div>

          <div class="form-group">
            <label for="amount-input">Сумма пополнения (₽)</label>
            <input
              type="number"
              id="amount-input"
              class="form-control"
              placeholder="0.00"
              min="10"
              max="500000"
              step="0.01"
              required
            />
          </div>

          <button type="submit" class="btn-submit" id="submit-btn">
            Пополнить баланс
          </button>
        </form>
      </div>
    </div>

    <script>
      const errorBlock = document.getElementById("error-block");
      const successBlock = document.getElementById("success-block");
      const form = document.getElementById("replenish-form-element");
      const submitBtn = document.getElementById("submit-btn");
      const cardInput = document.getElementById("card-input");

      document
        .getElementById("btn-dashboard")
        .addEventListener("click", async () => {
          window.location.href = "/dashboard";
        });

      function showError(msg) {
        successBlock.style.display = "none";
        errorBlock.textContent = msg;
        errorBlock.style.display = "block";
      }

      function showSuccess(msg) {
        errorBlock.style.display = "none";
        successBlock.textContent = msg;
        successBlock.style.display = "block";
      }

      cardInput.addEventListener("input", (e) => {
        let value = e.target.value.replace(/\D/g, "");
        let formatted = "";

        for (let i = 0; i < value.length; i++) {
          if (i > 0 && i % 4 === 0) {
            formatted += " ";
          }
          formatted += value[i];
        }
        e.target.value = formatted;
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const amount = document.getElementById("amount-input").value;
        const cardNumber = cardInput.value;
        const value = {
          amount: amount,
          cardNumber: cardNumber,
        };

        try {
          const response = await fetch("/api/user/replenish", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(value),
          });
          const data = await response.json();

          showSuccess(data?.message || "Баланс успешно пополнен!");
          form.reset();

          setTimeout(() => {
            window.location.href = "/dashboard";
          }, 2000);
        } catch (error) {
          console.error("Критическая ошибка:", error);
          showError(
            "Не удалось выполнить операцию. Проверьте соединение с интернетом.",
          );
        }
      });
    </script>
  </body>
</html>
